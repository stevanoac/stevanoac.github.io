<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="About Steven Claros" />
        <title>404 — Steven Claros</title>
        <link rel="stylesheet" href="../styles.css" />
        <link rel="icon" type="image/x-icon" href="../images/icon.ico">
        <script src="../script.js" defer></script>
    </head>
    <body class="error-page">
        <div class="site-shell">
            <aside class="sidebar">
                <div class="dashboard-header">
                    <a class="brand" href="/" aria-label="Steven Claros home"
                        ><span class="full-brand">steven claros</span
                        ><span class="mini-brand">sc</span></a
                    ><button
                        class="dashboard-toggle"
                        type="button"
                        aria-expanded="true"
                        aria-controls="dashboard"
                        aria-label="Hide dashboard"
                    >
                        <span aria-hidden="true">«</span>
                    </button>
                </div>
                <div class="dashboard-body" id="dashboard">
                    <button
                        class="menu-toggle"
                        type="button"
                        aria-expanded="true"
                        aria-controls="site-menu"
                        aria-label="Close pages menu"
                    >
                        <span>pages</span
                        ><span class="menu-icon" aria-hidden="true">−</span>
                    </button>
                    <nav
                        class="directory is-open"
                        id="site-menu"
                        aria-label="Site directory"
                    >
                        <div class="directory-inner">
                            <a class="directory-link" href="/">home</a
                            ><a class="directory-link" href="/about/">about</a
                            ><a class="directory-link" href="/projects/"
                                >projects</a
                            ><a class="directory-link" href="/hardware/"
                                >hardware</a
                            ><a class="directory-link" href="/contact/"
                                >contact</a
                            >
                        </div>
                    </nav>
                </div>
                <div class="sidebar-footer">
                    <p class="copyright">© 2026 Steven Claros</p>
                </div>
            </aside>
            <main class="main-content">
                <section class="page-content">
                    <p class="section-kicker">error - 404</p>
                    <h1>uhh, 404</h1>
                    <p>
                        Well, I'm not too sure how you got here. If you clicked
                        on a link from this website, it's more than likely that
                        page is WIP.
                    </p>
                    <p>For now, you can play with the 404s.</p>
                    <div class="error-field" data-error-field aria-label="Interactive floating 404s"></div>
                    <audio data-error-sound src="sounds/sound.mp3" preload="auto"></audio>
                </section>
            </main>
        </div>
    </body>
</html>
