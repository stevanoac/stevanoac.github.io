<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Contact — Steven Claros</title>
        <script>document.documentElement.dataset.theme = localStorage.getItem("steven-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
        <link rel="stylesheet" href="../styles.css" />
        <link rel="icon" type="image/x-icon" href="../images/icon.ico" />
        <script src="../script.js" defer></script>
    </head>
    <body>
        <div class="site-shell">
            <aside class="sidebar">
                                <div class="theme-toggle-wrap">
                    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false">
                        <span class="theme-icon" aria-hidden="true">☾</span>
                    </button>
                </div>                <div class="dashboard-header">
                    <a class="brand" href="/"
                        ><span class="full-brand">steven claros</span
                        ><span class="mini-brand">sc</span></a
                    ><button
                        class="dashboard-toggle"
                        type="button"
                        aria-expanded="true"
                        aria-controls="dashboard"
                        aria-label="Hide dashboard"
                    >
                        <span>«</span>
                    </button>
                </div>
                <div class="dashboard-body" id="dashboard">
                    <button
                        class="menu-toggle"
                        type="button"
                        aria-expanded="true"
                        aria-controls="site-menu"
                    >
                        <span>pages</span><span class="menu-icon">−</span>
                    </button>
                    <nav class="directory is-open" id="site-menu">
                        <div class="directory-inner">
                            <a class="directory-link" href="/">home</a
                            ><a class="directory-link" href="/about/">about</a
                            ><a class="directory-link" href="/projects/"
                                >projects</a
                            ><a class="directory-link" href="/hardware/"
                                >hardware</a
                            ><a class="directory-link active" href="/contact/"
                                >contact</a
                            >
                        </div>
                    </nav>
                </div>
                <div class="sidebar-footer">
                    <p class="copyright">© 2026 Steven Claros</p>
                </div>
            </aside>
            <main class="main-content">
                <section class="page-content">
                    <p class="section-kicker">contact</p>
                    <h1>contact me</h1>
                    <p>Have a question or a good idea?</p>
                    <p>
                        <a class="email-link" href="mailto:help@stevanoac.dev"
                            >hello@stevanoac.dev ↗</a
                        >
                    </p>
                    <p>
                        <i
                            >notice: if you receive a response, you will see a
                            response from a gmail.</i
                        >
                    </p>
                    <footer class="social-footer" aria-label="Social links">
                        <p class="section-kicker">find me elsewhere</p>
                        <div class="social-links">
                            <button
                                class="social-link social-discord"
                                type="button"
                                data-discord-trigger
                                aria-label="Show Discord username"
                            >
                                <img src="social/discord.png" alt="Discord" />
                                <span
                                    class="discord-bubble"
                                    data-discord-bubble
                                    role="status"
                                    >stevanoac</span
                                >
                            </button>
                            <a
                                class="social-link"
                                href="https://github.com/stevanoac"
                                target="_blank"
                                rel="noreferrer"
                                aria-label="GitHub"
                                ><img src="social/github.png" alt="GitHub"
                            /></a>
                            <a
                                class="social-link"
                                href="https://www.youtube.com/@stevanoac"
                                target="_blank"
                                rel="noreferrer"
                                aria-label="YouTube"
                                ><img src="social/youtube.png" alt="YouTube"
                            /></a>
                            <a
                                class="social-link"
                                href="https://www.instagram.com/stevanoac/"
                                target="_blank"
                                rel="noreferrer"
                                aria-label="Instagram"
                                ><img
                                    src="social/instagram.png"
                                    alt="Instagram"
                            /></a>
                            <a
                                class="social-link"
                                href="https://www.linkedin.com/in/steven-claros/"
                                target="_blank"
                                rel="noreferrer"
                                aria-label="LinkedIn"
                                ><img src="social/linkedin.png" alt="LinkedIn"
                            /></a>
                        </div>
                    </footer>
                </section>
            </main>
        </div>
    </body>
</html>
